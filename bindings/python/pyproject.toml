[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memswap"
version = "0.1.0"
description = "Portable agent memory interchange format — Python binding over the memswap FFI (Hermes/Codex/Claude Code memory, lossless)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "memswap contributors" }]
keywords = ["ai-agents", "agent-memory", "llm", "hermes", "codex", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[tool.setuptools]
packages = ["memswap"]
include-package-data = true

[tool.setuptools.package-data]
memswap = ["lib/*"]
