[workspace]
resolver = "2"
members = [
    "crates/memswap-core",
    "crates/memswap-adapters",
    "crates/memswap-cli",
    "crates/memswap-ffi",
    "crates/sample-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/SaltKing0/memswap"
authors = ["memswap contributors"]

[workspace.dependencies]
memswap-core = { path = "crates/memswap-core", version = "0.1.0" }
memswap-adapters = { path = "crates/memswap-adapters", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"
walkdir = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
strip = true
